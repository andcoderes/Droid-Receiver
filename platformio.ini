; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#ee406566f0f12d07f135f6ae846b86a8f62628b0
board = seeed-xiao-esp32-s3-plus
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
monitor_speed = 115200
extra_scripts = pre:scripts/load_secrets.py
build_flags =
	-D FIRMWARE_VERSION='"0.1.0"'
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
platform_packages =
	platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
	tool-esptoolpy@https://files.seeedstudio.com/arduino/platformio/esptoolpy-v5.1.2.zip

[env:native]
platform = native
build_flags = 
	-I test/mocks
	-I src
	-std=c++11
	-D UNIT_TEST
test_build_src = true
build_src_filter = +<*> +<../test/mocks/>
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
